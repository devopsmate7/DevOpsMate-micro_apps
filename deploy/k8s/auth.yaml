apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      # Annotated by Terraform with the IRSA role that grants DynamoDB access.
      serviceAccountName: auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: auth
          image: devopsmate-auth
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: devopsmate-config
            - secretRef:
                name: devopsmate-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  selector:
    app: auth
  ports:
    - name: http
      port: 8000
      targetPort: http
