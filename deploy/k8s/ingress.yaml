# Provisioned as an internet-facing ALB by the AWS Load Balancer Controller.
# Rules are evaluated in order, so the catch-all "/" must stay last.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devopsmate
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth
                port:
                  name: http
          - path: /api/catalog
            pathType: Prefix
            backend:
              service:
                name: catalog
                port:
                  name: http
          - path: /api/commerce
            pathType: Prefix
            backend:
              service:
                name: commerce
                port:
                  name: http
          - path: /api/notice
            pathType: Prefix
            backend:
              service:
                name: notice
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
