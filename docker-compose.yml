services:
  dynamodb-local:
    image: public.ecr.aws/aws-dynamodb-local/aws-dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    working_dir: /home/dynamodblocal
    user: root
    ports:
      - "8500:8000"
    volumes:
      - dynamodata:/data
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  auth:
    build: ./src/services/auth
    environment:
      AWS_REGION: ap-south-1
      DYNAMODB_TABLE_USERS: devopsmate_users
      # No endpoint and no keys: on EC2 the container uses the instance role
      # and stores users in real DynamoDB. For laptop DynamoDB Local, set
      # DYNAMODB_ENDPOINT_URL=http://dynamodb-local:8000 and dummy AWS keys.
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-later}
      # Defaults send mail to MailHog (laptop). On EC2, scripts/start.sh
      # writes Gmail settings into .env. Never commit .env.
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: "${SMTP_FROM:-DevOpsMate <devopsmate7@gmail.com>}"
      SMTP_TLS: ${SMTP_TLS:-false}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      INTERVIEW_QA_PACK_PATH: /app/assets/interview-qa/Real-DevOps-Cloud-Interview-Questions.zip
      ADMIN_KEY: ${ADMIN_KEY:-dm-admin-change-me}
      ADMIN_MOBILE: ${ADMIN_MOBILE:-7013274348}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-amtheadmin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@devopsmate.local}
    volumes:
      - ./assets/interview-qa:/app/assets/interview-qa:ro
    ports:
      - "8000:8000"
    depends_on:
      - dynamodb-local
      - mailhog
    restart: unless-stopped

  catalog:
    build: ./src/services/catalog
    ports:
      - "8001:8001"
    restart: unless-stopped

  commerce:
    build: ./src/services/commerce
    environment:
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-later}
      ADMIN_KEY: ${ADMIN_KEY:-dm-admin-change-me}
      ADMIN_MOBILE: ${ADMIN_MOBILE:-7013274348}
      UPI_ID: ${UPI_ID:-devopamate@ybl}
      UPI_ID_ALT: ${UPI_ID_ALT:-balureddy123457@ybl}
      PACK_PRICE_INR: ${PACK_PRICE_INR:-99}
      AUTH_INTERNAL_URL: http://auth:8000
    volumes:
      - commercedata:/data
    # A new volume is owned by root. This service must write its database file there.
    user: "0:0"
    ports:
      - "8002:8002"
    depends_on:
      - auth
    restart: unless-stopped

  notice:
    build: ./src/services/notice
    ports:
      - "8003:8003"
    restart: unless-stopped

  frontend:
    build: ./src/frontend
    ports:
      - "3000:80"
    depends_on:
      - auth
      - catalog
      - commerce
      - notice
    restart: unless-stopped

volumes:
  dynamodata:
  commercedata:
