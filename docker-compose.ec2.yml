# Production compose for one EC2 host. Only the frontend is published (port 80).
# nginx inside that container proxies /api/* to the other services.
# Real DynamoDB is used through the EC2 instance role (no keys in this file).
# Terraform writes /opt/devopsmate/.env before the first start.
services:
  auth:
    build: ./src/services/auth
    env_file: .env
    restart: unless-stopped

  catalog:
    build: ./src/services/catalog
    restart: unless-stopped

  commerce:
    build: ./src/services/commerce
    env_file: .env
    volumes:
      - commercedata:/data
    restart: unless-stopped

  notice:
    build: ./src/services/notice
    restart: unless-stopped

  frontend:
    build: ./src/frontend
    ports:
      - "80:80"
    depends_on:
      - auth
      - catalog
      - commerce
      - notice
    restart: unless-stopped

volumes:
  commercedata:
