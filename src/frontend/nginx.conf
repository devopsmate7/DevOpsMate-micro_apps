server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Used by docker-compose. On EKS the ALB Ingress routes /api/* straight to each
    # service, so these blocks are only a fallback there.
    # Docker's DNS + variables make nginx re-resolve service names, so recreating
    # one container (new IP) does not leave nginx returning 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/auth/ {
        set $auth http://auth:8000;
        proxy_pass $auth;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /api/catalog/ {
        set $catalog http://catalog:8001;
        proxy_pass $catalog;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/commerce/ {
        set $commerce http://commerce:8002;
        proxy_pass $commerce;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 480s;
        proxy_send_timeout 480s;
    }

    location /api/notice/ {
        set $notice http://notice:8003;
        proxy_pass $notice;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
