server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Used by docker-compose. On EKS the ALB Ingress routes /api/* straight to each
    # service, so these blocks are only a fallback there.
    location /api/auth/ {
        proxy_pass http://auth:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/catalog/ {
        proxy_pass http://catalog:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/commerce/ {
        proxy_pass http://commerce:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/notice/ {
        proxy_pass http://notice:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
