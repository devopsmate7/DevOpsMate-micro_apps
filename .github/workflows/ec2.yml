# Deploys the containers onto the EC2 instance created by infra/ec2.
# First boot already starts the app. This workflow rebuilds it on later pushes.
#
# Required after `terraform apply` in infra/ec2:
#   secrets.AWS_EC2_ROLE_ARN   output deploy_role_arn
#   vars.AWS_REGION            optional, defaults to ap-south-1
name: ec2

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docker-compose.ec2.yml"
      - "scripts/ec2-deploy.sh"
      - ".github/workflows/ec2.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ec2-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_EC2_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find the instance
        id: instance
        run: |
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=devopsmate-ec2" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [ -z "$ID" ] || [ "$ID" = "None" ]; then
            echo "No running devopsmate-ec2 instance. Apply infra/ec2 first."
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Pull and rebuild
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.id }}" \
            --document-name AWS-RunShellScript \
            --comment "devopsmate deploy" \
            --parameters 'commands=["bash /opt/devopsmate/scripts/ec2-deploy.sh"]' \
            --query "Command.CommandId" --output text)
          echo "command id: $CMD_ID"
          set +e
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "${{ steps.instance.outputs.id }}"
          status=$?
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ steps.instance.outputs.id }}" \
            --query "[Status,StandardOutputContent,StandardErrorContent]" --output text
          exit $status
