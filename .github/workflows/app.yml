# Pipeline 2 of 2: builds the application images, pushes them to ECR and bumps the
# image tags in deploy/k8s. ArgoCD (installed by the infra pipeline) notices the
# commit and rolls the new version out to EKS. No cluster credentials are needed here.
#
# Required repo settings (values come from `terraform output` in infra/bootstrap):
#   secrets.AWS_APP_ROLE_ARN   IAM role (ECR push only) assumed through GitHub OIDC
#   vars.AWS_REGION            optional, defaults to ap-south-1
name: app

on:
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/app.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  PROJECT: devopsmate

jobs:
  build:
    name: build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: frontend
            context: src/frontend
          - service: auth
            context: src/services/auth
          - service: catalog
            context: src/services/catalog
          - service: commerce
            context: src/services/commerce
          - service: notice
            context: src/services/notice
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: AWS credentials
        if: env.PUBLISH == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: env.PUBLISH == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ env.PUBLISH == 'true' && format('{0}/{1}/{2}:{3}', steps.ecr.outputs.registry, env.PROJECT, matrix.service, github.sha) || format('{0}-{1}:ci', env.PROJECT, matrix.service) }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: update manifests
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: imranismail/setup-kustomize@v2

      - name: Set image tags
        working-directory: deploy/k8s
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          for svc in frontend auth catalog commerce notice; do
            kustomize edit set image "${PROJECT}-${svc}=${REGISTRY}/${PROJECT}/${svc}:${GITHUB_SHA}"
          done
          kustomize build . > /dev/null

      # Commits made with GITHUB_TOKEN do not trigger workflows, so this cannot loop.
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Manifests already up to date."
            exit 0
          fi
          git commit -m "deploy: ${GITHUB_SHA::7} [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
