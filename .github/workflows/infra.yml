# Pipeline 1 of 2: creates/updates the AWS infrastructure (VPC, EKS, ECR, DynamoDB,
# ALB controller, ArgoCD) from infra/. Run this before the app pipeline.
#
# Required repo settings (values come from `terraform output` in infra/bootstrap):
#   secrets.AWS_INFRA_ROLE_ARN   IAM role assumed through GitHub OIDC
#   vars.TF_STATE_BUCKET         S3 bucket holding the Terraform state
#   vars.AWS_REGION              optional, defaults to ap-south-1
#   secrets.ARGOCD_REPO_TOKEN    optional, only needed if this repo is private
# Create a GitHub environment named "infra" (add required reviewers to gate apply/destroy).
name: infra

on:
  pull_request:
    paths:
      - "infra/**"
      - "!infra/bootstrap/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "!infra/bootstrap/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_region: ${{ vars.AWS_REGION || 'ap-south-1' }}
  TF_VAR_argocd_repo_url: https://github.com/${{ github.repository }}.git
  TF_VAR_argocd_repo_token: ${{ secrets.ARGOCD_REPO_TOKEN }}

defaults:
  run:
    working-directory: infra

jobs:
  plan:
    name: plan
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'plan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13.0"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: >
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ env.AWS_REGION }}"

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        id: plan
        run: terraform plan -no-color -out=tfplan | tee plan.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/plan.txt', 'utf8');
            const body = '### Terraform plan\n```\n' + plan.slice(-60000) + '\n```';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  apply:
    name: apply
    needs: plan
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13.0"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: >
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ env.AWS_REGION }}"

      - name: terraform apply
        run: terraform apply -auto-approve

      - name: Summary
        run: |
          {
            echo "### Infrastructure ready"
            echo '```'
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Manual run with action=apply (e.g. the very first deployment).
  apply-manual:
    name: apply (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13.0"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: >
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ env.AWS_REGION }}"

      - name: terraform apply
        run: terraform apply -auto-approve

      - name: Summary
        run: |
          {
            echo "### Infrastructure ready"
            echo '```'
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  destroy:
    name: destroy
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13.0"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_INFRA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: >
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ env.AWS_REGION }}"

      # The ALB and EBS volume are created by in-cluster controllers, not Terraform.
      # Remove them while the controllers still run, otherwise they are orphaned and
      # block VPC deletion.
      - name: Remove app resources from the cluster
        run: |
          CLUSTER=$(terraform output -raw cluster_name 2>/dev/null || true)
          if [ -z "$CLUSTER" ]; then
            echo "No cluster in state, skipping."
            exit 0
          fi
          aws eks update-kubeconfig --name "$CLUSTER" --region "$AWS_REGION"
          kubectl -n argocd delete applications.argoproj.io --all --ignore-not-found --wait=true || true
          kubectl -n devopsmate delete ingress --all --ignore-not-found --wait=true || true
          kubectl -n devopsmate delete deployment --all --ignore-not-found --wait=true || true
          kubectl -n devopsmate delete pvc --all --ignore-not-found --wait=true || true
          sleep 60

      - name: terraform destroy
        run: terraform destroy -auto-approve
