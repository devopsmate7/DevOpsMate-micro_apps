# Used on the EC2 host only. Caddy owns ports 80 and 443 and gets a free
# Let's Encrypt certificate for devopsmate7.duckdns.org.
# The frontend container is not published on port 80 when this file is included
# together with a compose command that does not also map that port.
services:
  # This file is only used on the server. Mail goes to Gmail, not MailHog.
  # The app password stays in .env on the server (SMTP_PASSWORD). Never commit it.
  auth:
    environment:
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-devopsmate7@gmail.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: "${SMTP_FROM:-DevOpsMate <devopsmate7@gmail.com>}"
      SMTP_TLS: ${SMTP_TLS:-true}

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
